# La tarea: el palé, el catálogo de paquetes, los niveles y los pesos. SI.
#
# AQUÍ NO HAY GUION. Este fichero describe la celda y parametriza la decisión; dónde va
# cada caja lo decide el planificador.
#
# ── OJO CON LAS UNIDADES DE TAMAÑO ────────────────────────────────────────────
# `dims` = dimensiones COMPLETAS. `size` = SEMIEJES, que es lo que quiere MuJoCo. Son
# claves distintas a propósito: un factor 2 escondido en un YAML no lo caza nadie.
# `src/cell/scene.py` divide entre dos en un único sitio, al construir los geoms.
#
# ── LAS CIFRAS CALIBRADAS, Y CÓMO SE MIDIERON ─────────────────────────────────
# Todas son del UR10e con el OnRobot VGP20. Si cambia el robot o la herramienta, se
# REPITEN; no se copian.
#
#   reach_tolerance 20 mm   (scene.yaml) La caída estacionaria que la corrección
#       cartesiana no quita es de unos pocos milímetros: un servo de posición aguanta
#       contra la gravedad con error permanente de varios miliradianes, y un cartón
#       sobre las ventosas lo empuja más allá de quince. Una pose que el brazo NO puede
#       sostener falla por centenares de mm. 20 mm separa las dos cosas. Por debajo de
#       ~8 mm todo acaba declarado `ik_unreachable`; por encima de ~40 mm se sella sobre
#       una caja a la que la herramienta nunca llegó y se la coge por una esquina.
#
#   cup_gap 1,5 mm          (scene.yaml) Hueco entre la cara de la ventosa y la tapa al
#       sellar. Por debajo, el contacto empuja el cartón antes de que haya vacío y la
#       caja sale desplazada; por encima de ~4 mm el sello no agarra.
#
#   holgura 40 mm           (`clearance`, abajo) Entre cajas de la misma capa. Aquí NO
#       la impone el dedo —no hay dedos— sino el error de seguimiento del descenso más
#       la basculación del cartón colgado de las ventosas. Con 20 mm hay roces en el
#       descenso; con 40 mm no los hay en ninguna de las 168 pruebas ni en el benchmark
#       de 20 órdenes. Es la ventaja más clara de la ventosa sobre la pinza: con pinza
#       paralela la holgura la fijaba el grueso del dedo y el techo de ocupación se
#       quedaba en 72-76 %.
#
#   drop_clearance 2 mm     (scene.yaml) Se suelta prácticamente en contacto. Con
#       ventosa no hay que abrir nada y el cartón no se escurre al soltar, así que la
#       curva de error contra altura de suelta no tiene fondo: cuanto más bajo, mejor.
#       2 mm es lo que hace falta para no empujar el montón al llegar.
#
#   masa máxima 8,5 kg      Carga útil nominal del UR10e (12,5 kg) menos los 2,55 kg del
#       VGP20, dejando 1,45 kg de margen.
#
#   bahía 0,74 × 0,88 m     Ver la cabecera de `truck` en `scene.yaml`: recortada con IK
#       sobre 60 cargas aleatorias, 0 de 720 poses de agarre fuera de alcance.

pallet:
  center: [0.60, 0.00]           # [x, y] en el mundo
  dims: [1.20, 0.80]             # [x, y] COMPLETAS. Va a runs.config.pallet_size_m
  deck_thickness: 0.144          # z de la cara superior: sobre ella se apila
  max_height: 1.35               # por encima, el hueco no es candidato
  max_mass: 350.0
  rgba: [0.62, 0.39, 0.18, 1]
  # Europalé real, no maqueta: la interfaz dibuja a escala 1.
  scale: 1.0
  clearance: 0.040               # holgura entre cajas de la misma capa. Ver cabecera.

# Ensayo físico opcional que se ejecuta DESPUÉS de paletizar y siempre restaura la
# misma pila antes de cada prueba. Son exactamente las cifras ya medidas y verificadas
# en `tools/scenarios/mixed_boxes.yaml`: se portan, no se recalibran a ojo. Los cinco
# picos cubren desde maniobra lenta hasta la frenada longitudinal de EN 12195-1; 30 mm
# es el desplazamiento máximo que el demostrador usa como umbral de carga retenida.
stability_test:
  levels_g: [0.05, 0.15, 0.30, 0.50, 0.80]
  axes: [x, y, z]
  duration: 0.50
  settle_seconds: 1.5
  hold_seconds: 0.5
  rest_seconds: 0.35
  max_shift_m: 0.030
  # Cresta de 10 cm, primero paralela a X y después a Y. El límite de 8 grados es el
  # mismo con el que `tools/tests/test_shake.py` discrimina una carga que vuelca.
  beam_width: 0.10
  beam_height: 0.05
  beam_settle_seconds: 2.0
  max_tilt_deg: 8.0

# Catálogo de paquetes. `dims` COMPLETAS.
#
# `cog_offset` es la VERDAD de la simulación —lo que `src/cell/scene.py` monta en el
# modelo— y NO lo que el sistema sabe: `src/vision/gauge.py` tiene que estimarlo
# midiendo. Un gauge que lea este valor es un oráculo con otro nombre.
#
# En MuJoCo se monta como un `<inertial>` explícito dentro del body, no como `pos` del
# geom: así el cartón se ve centrado y sólo la inercia está descentrada, que es lo que
# pasa de verdad cuando el contenido se asienta a un lado.
packages:
  book_s:
    dims: [0.24, 0.18, 0.10]
    mass: 1.2
    cog_offset: [0.025, -0.010, 0.000]
    friction: [0.95, 0.01, 0.001]
    rgba: [0.64, 0.43, 0.23, 1]
  small:
    dims: [0.30, 0.22, 0.12]
    mass: 1.8
    cog_offset: [0.025, 0.000, 0.000]
    friction: [0.95, 0.01, 0.001]
    rgba: [0.72, 0.51, 0.29, 1]
  shoe_m:
    dims: [0.33, 0.24, 0.14]
    mass: 2.4
    cog_offset: [-0.035, 0.015, -0.010]
    friction: [0.95, 0.01, 0.001]
    rgba: [0.58, 0.38, 0.20, 1]
  std_s:
    dims: [0.38, 0.28, 0.16]
    mass: 3.5
    cog_offset: [0.020, 0.020, -0.015]
    friction: [0.95, 0.01, 0.001]
    rgba: [0.76, 0.57, 0.34, 1]
  std_m:
    dims: [0.42, 0.30, 0.18]
    mass: 4.2
    cog_offset: [0.050, 0.000, 0.010]
    friction: [0.95, 0.01, 0.001]
    rgba: [0.64, 0.43, 0.23, 1]
  apparel:
    dims: [0.45, 0.32, 0.20]
    mass: 5.4
    cog_offset: [-0.030, -0.025, 0.000]
    friction: [0.95, 0.01, 0.001]
    rgba: [0.72, 0.51, 0.29, 1]
  std_l:
    dims: [0.48, 0.34, 0.22]
    mass: 6.2
    cog_offset: [0.000, -0.040, -0.025]
    friction: [0.95, 0.01, 0.001]
    rgba: [0.58, 0.38, 0.20, 1]
  heavy_l:
    dims: [0.55, 0.36, 0.26]
    mass: 8.5
    cog_offset: [-0.060, 0.035, -0.035]
    friction: [0.95, 0.01, 0.001]
    rgba: [0.76, 0.57, 0.34, 1]

# El sobre del que se sortea cuando un nivel pide `random`. La masa NO se sortea: es
# densidad × volumen, que es lo que hace que un bulto grande y ligero y otro pequeño y
# denso sean problemas distintos.
generator:
  length: [0.18, 0.55]
  width: [0.16, 0.40]
  height: [0.08, 0.30]
  volume: [0.004, 0.050]         # 4-50 L
  density: [90, 280]             # ropa ligera / relleno hasta libros densos
  mass: [0.5, 8.5]               # 8,5 kg es el tope de caja del UR10e con el VGP20
  max_aspect_ratio: 4.0          # lado mayor <= 4 x el menor
  cog_fraction: 0.25             # |offset| <= 25 % de cada semieje
  cog_sigma: 0.10
  cog_z_bias: -0.04              # el contenido se asienta un poco por debajo del centro

# ── LOS NUEVE NIVELES ─────────────────────────────────────────────────────────
#
# Tres tareas, tres niveles cada una. El `id` es lo que se sube a `episodes.level`, y la
# DECENA es la tarea: 1x mesa, 2x cinta, 3x camión. Se codifica así porque la plataforma
# tiene un solo entero por episodio y `task` es un vocabulario cerrado (todo esto es
# `palletizing`): sin la decena, la interfaz compararía un nivel 2 de mesa contra un
# nivel 2 de camión como si fueran lo mismo. `config.source` y `config.level_name` lo
# dejan legible en la pantalla de ejecuciones.
#
# Añadir un nivel es añadir una fila. Cuatro ejes suben a la vez:
#   catálogo   un tipo -> mezcla -> sorteado del generador
#   pose       alineada -> girada -> girada y descentrada
#   CoG        centrado -> el del catálogo -> adversarial (al límite del sobre)
#   volumen    pocos bultos y una capa -> el palé lleno
levels:
  - {id: 11, source: table,    name: "mesa · N1 · un tipo, alineado",
     n_packages: 4, types: [std_m],  yaw_jitter_deg: 0,  pos_jitter_m: 0.000, cog: centred}
  - {id: 12, source: table,    name: "mesa · N2 · mezcla, girado",
     n_packages: 6, types: [book_s, small, shoe_m, std_s, std_m, apparel],
     yaw_jitter_deg: 15, pos_jitter_m: 0.010, cog: catalogue}
  - {id: 13, source: table,    name: "mesa · N3 · sorteado, CoG adversario",
     n_packages: 8, types: [random], yaw_jitter_deg: 30, pos_jitter_m: 0.020, cog: adversarial}

  - {id: 21, source: conveyor, name: "cinta · N1 · un tipo, centrado en la banda",
     n_packages: 4, types: [std_m],  yaw_jitter_deg: 0,  pos_jitter_m: 0.000, cog: centred}
  - {id: 22, source: conveyor, name: "cinta · N2 · mezcla, llegada descentrada",
     n_packages: 6, types: [book_s, small, shoe_m, std_s, std_m, apparel],
     yaw_jitter_deg: 15, pos_jitter_m: 0.020, cog: catalogue}
  - {id: 23, source: conveyor, name: "cinta · N3 · sorteado, separación variable",
     n_packages: 8, types: [random], yaw_jitter_deg: 30, pos_jitter_m: 0.035, cog: adversarial}

  - {id: 31, source: truck,    name: "camión · N1 · columnas ordenadas",
     n_packages: 5, types: [small, shoe_m, std_s, std_m, std_l],
     yaw_jitter_deg: 0,  pos_jitter_m: 0.000, cog: catalogue}
  - {id: 32, source: truck,    name: "camión · N2 · con el desorden del cargador",
     n_packages: 6, types: [book_s, small, shoe_m, std_s, std_m, apparel],
     yaw_jitter_deg: 0,  pos_jitter_m: 0.000, cog: catalogue, loader_jitter: true}
  - {id: 33, source: truck,    name: "camión · N3 · sorteado, CoG adversario",
     n_packages: 8, types: [random], yaw_jitter_deg: 0, pos_jitter_m: 0.000,
     cog: adversarial, loader_jitter: true}

# Los mandos de `src/planner/heuristic.py`, que es el adaptador sobre `placing/`.
#
# Están aquí y no en el código porque se van a tocar mucho y cada cambio tiene que poder
# explicarse. Para cambiar el comportamiento se tocan los pesos, no el código; un peso a
# 0 apaga su término por completo.
#
# ── EL CONVENIO DE ALTURAS, QUE ES LA TRAMPA QUE MÁS CUESTA VER ────────────────────
# `placing` trabaja en Z DEL MUNDO y este repo en metros SOBRE LA CUBIERTA. La
# traducción la hace el adaptador, y la hace en los DOS sitios: el mapa y el límite de
# altura. Por eso aquí NO hay un `max_stack_height`: se calcula como
# `pallet.deck_thickness + pallet.max_height` (0.144 + 1.35 = 1.494) y así no puede
# quedarse la mitad sin traducir. Medio convenio funciona y no se nota hasta que el
# montón se pasa de alto o deja de aceptar cajas sin motivo.
heuristic:
  cell_size: 0.010               # lado de celda del mapa de alturas, en metros.
                                 # La rejilla del palé sale 120x80. Es el valor por
                                 # defecto de `placing`, no una medida de esta celda:
                                 # SIN BARRER, igual que lo estaba el 0.040 anterior.
                                 # Coste medido en la feature: 16 ms/caja con 60x40 a
                                 # 1 cm, y el coste va con el cuadrado de la rejilla.
                                 # Si estorba, 0.020 antes que tocar nada más.
  clearance: 0.040               # holgura alrededor de la huella. Es la misma de
                                 # `pallet.clearance`, que sí está medida aquí: con
                                 # ventosa no la impone el dedo.
  support_tol: 0.001             # por debajo de 1 mm, dos alturas son la misma
  max_stack_height: 0.55         # altura de montón, en metros SOBRE LA CUBIERTA.
                                 # NO es `pallet.max_height` (1.35): ése es el papel del
                                 # palé y esta celda no llega. El barrido de IK de
                                 # `tests/test_cell.py` valida el brazo hasta
                                 # `deck_z + 0.55` y nada más arriba, así que 0.55 es la
                                 # única altura que está MEDIDA aquí.
                                 #
                                 # Y ojo, porque esta cifra hace dos cosas: es el límite
                                 # duro (`max_stack_height` descarta la pose) y es la
                                 # ESCALA de `lowness` (= 1 − z_base/límite) y de lo que
                                 # `peak_penalty` compara. Ponerla en 1.494 no sólo
                                 # permite montones que el brazo no alcanza: diluye el
                                 # gradiente de `lowness` 3.4x y la heurística se pone a
                                 # hacer torre en vez de llenar la capa, con el margen de
                                 # estabilidad en negativo desde la segunda caja. Medido.
  min_support_ratio: 0.60        # por debajo, el hueco no es candidato. Lo leen el
                                 # adaptador y `naive.GridPlanner`: una sola cifra.
  allow_unobserved: true         # ARRANCA EN TRUE. Bajarlo a false en cuanto esté
                                 # medida la cobertura de las tres cámaras sobre un palé
                                 # vacío (AGENTS.md §9): con oclusión sin medir, un
                                 # `false` deja de aceptar cajas y parece otra cosa.
  proximity_band: 0.02           # a qué distancia cuenta un vecino como apoyo lateral
  levelness_scale: 0.2           # la desviación de altura que ya se considera mucha
  useful_gap: 0.0                # franja más estrecha que todavía sirve para algo.
                                 # 0 = el lado menor de la caja que se está colocando,
                                 # que es lo honesto mientras no haya catálogo fijo.
  yaws: [0.0, 90.0]              # GRADOS. `placing` añade 180/270 solo, cuando el CoG
                                 # del paquete está descentrado y el giro cambia algo.
  # ── ALCANCE: SIGUE APAGADO, Y AHORA SE SABE POR QUÉ CUESTA MEDIRLO ──────────────
  # Se intentó encenderlo con un barrido propio y el barrido estaba MAL. Con la mano
  # vacía sale que el brazo sostiene hasta 1.203 m y que sólo falla pegado al pedestal
  # y abajo (primer fallo a 0.373 m, todas buenas desde 0.447 m). Pero repetido CON LA
  # CAJA EN LA MANO, ninguna de las 32 poses a 0.10 m sobre la cubierta es alcanzable
  # —0/32, a cualquier distancia y con la muñeca a 0 o a 180°—, y eso no es alcance: es
  # que la caja cuelga POR DEBAJO de la cara de las ventosas, así que pedir el TCP a
  # 0.10 m con un bulto de 0.18 m mete el cartón dentro de la cubierta. La pose no
  # existe. Medir el alcance del brazo cargado exige poner el TCP donde lo pone la
  # maniobra de verdad —tapa de la caja más `cup_gap` más `drop_clearance`— y eso es un
  # barrido aparte.
  #
  # Encenderlo con las cifras de la mano vacía arregla el nivel 32 y ROMPE el 31 (1/5,
  # `ik_unreachable`), así que se queda apagado: `reach_max: 0` desactiva el filtro y
  # deja `reachability` neutro. Con él apagado, los nueve niveles van como dice el
  # README. Cuando se mida bien, se enciende poniendo `robot_xy` y `reach_max`.
  # robot_xy: [0.60, -0.72]      # el pedestal, de `scene.yaml: robot.base_pos`
  reach_max: 0.0                 # 0 = filtro apagado
  reach_min: 0.0
  reach_knee: 0.25
  reach_falloff: 0.0
  weights:                       # los 14 términos de `placing`. NO suman 1, y no tienen
                                 # que sumarlo: el score se normaliza dividiendo por la
                                 # suma de pesos, y sale en [0,1] igual.
    void_fill: 1.2               # no dejar aire atrapado debajo
    support_ratio: 1.0           # fracción de la huella que apoya
    levelness: 0.8               # mantener plano el techo del montón
    gap_waste: 0.8               # no dejar franjas demasiado estrechas para llenarlas
    reachability: 0.7            # neutro mientras `robot_xy` no esté puesto
    lowness: 0.6                 # preferir z_base bajo
    peak_penalty: 0.5            # no levantar el punto más alto
    overhang: 0.5                # penalizar el voladizo
    bridge: 0.5                  # tender una caja sobre dos vecinas
    com_margin: 0.4              # margen del CoG del paquete al borde de su apoyo
    edge_flush: 0.4              # romper alineaciones de esquina
    lateral_proximity: 0.3       # apoyarse contra vecinos o el canto
    seam_break: 0.2              # evitar juntas corridas
    pallet_com: 0.8              # acercar el CoG del montón al centro del palé.
                                 # MEDIDO AQUÍ, y es el término que más cambia lo que se
                                 # ve. A 0 —el defecto de la feature— el desempate de
                                 # `placing` va por x ascendente, así que con huecos
                                 # empatados todo se amontona contra el canto de menor x
                                 # y la mitad del europalé se queda vacía. Barrido en el
                                 # nivel 11, semilla 1, midiendo el CoG del montón
                                 # respecto al centro del palé y el ancho aprovechado:
                                 #
                                 #   peso   CoG    ancho       margen
                                 #   0.0    287mm  0.65/1.20   257mm
                                 #   0.4    154mm  0.88/1.20   216mm
                                 #   0.8     10mm  1.00/1.20   305mm   <- aquí
                                 #   1.5     91mm  1.11/1.20   209mm
                                 #
                                 # A 1.5 se pasa de frenada. En N2 el CoG baja de 151 a
                                 # 70 mm y el margen sube de 293 a 315; en N3 baja de 157
                                 # a 110 mm. Los tres siguen en verde.
    # Tres notas para quien toque esta tabla:
    #
    #   - `bridge` y `gap_waste` tiran en dirección contraria a `void_fill`. Un puente
    #     tiene aire debajo por construcción, así que su peso tiene que pagar lo que
    #     `void_fill` le quita o no gana nunca. Los tres se miran juntos.
    #   - `pallet_com` está a 0 a propósito, pero el `PalletState` que necesita YA se
    #     acumula en `ScorePlanner.record()`. Subirlo es editar este número y medir.
    #   - Ninguno de estos catorce está barrido en ESTA celda: son los que la feature
    #     midió sobre un palé de 0.60x0.40 con un Panda. Cuando se ajuste uno, su medida
    #     va aquí al lado.

# La percepción del palé: de dónde sale el mapa de alturas cuando NO se usa el oráculo.
#
# Tres cámaras miran al palé: la cenital —que es la misma `top` que sube a la plataforma,
# compartida a propósito— y dos diagonales opuestas. Las diagonales viven aquí y no en
# `cameras:` porque ese bloque es un VOCABULARIO CERRADO (`top|side|iso|camera`) validado
# contra el CHECK de `snapshots.view`: una cámara con otro nombre ahí haría que el PNG
# subiera a Storage y la base rechazara la fila con un 23514. Éstas no suben fotos, sólo
# alimentan la fusión, así que no tienen por qué pasar por ese vocabulario.
#
# Por qué dos diagonales opuestas y no una: `min_upward_nz` tira los costados de las
# cajas y se queda sólo con las tapas y la cubierta. Lo que una diagonal ve de canto, la
# otra lo ve de plano. Con la cenital sola, cualquier caja tapa lo que tiene detrás.
perception:
  cameras: [top, diag_a, diag_b]
  z_min: -0.005                  # por debajo de la cubierta no hay montón que medir
  z_max: 2.5
  depth_min: 0.05                # metros; más cerca que esto es la propia cámara
  depth_trunc: 8.0
  min_upward_nz: 0.45            # cuánto tiene que mirar hacia arriba la normal local
                                 # de un píxel para contar como superficie apilable
  rig:
    # SIN MEDIR: posiciones de arranque, escaladas de la diagonal del palé de 0.60x0.40
    # de la feature a este europalé. `diag_a` cae sobre la bahía del remolque, así que la
    # oclusión hay que MIRARLA en el visor y dejar el número de cobertura escrito aquí
    # antes de fiarse (AGENTS.md §9). Sin ese número, `allow_unobserved` se queda en true.
    diag_a:
      position: [-0.36, -0.76, 1.90]
      lookat: [0.60, 0.00, 0.144]
      fovy: 75
      resolution: [640, 480]
    diag_b:
      position: [1.56, 0.76, 1.90]
      lookat: [0.60, 0.00, 0.144]
      fovy: 75
      resolution: [640, 480]

# El planificador de `src/planner/naive.py::BeamPlanner`, que es el que corre hoy.
#
# Estos pesos SÍ están medidos: con la semilla 17 y 10 permutaciones del catálogo, el
# beam search produce una pila estrictamente estable en el 100 % de los ensayos frente
# al 50 % de un first-fit, y baja el descentramiento medio del CoM de 142 mm a 81 mm.
# Normalizados a 1.0 desde 3.5 / 2.5 / 2.2 / 1.1 / 1.0 / 0.8 (suma 11.1).
planner:
  minimum_support_ratio: 0.62
  minimum_tipping_margin: 0.008
  beam_width: 20
  lookahead: 3
  candidates_per_node: 40
  heightmap_resolution: [12, 10]
  weights:
    support: 0.3153
    tipping_margin: 0.2252
    centered_com: 0.1982
    low_height: 0.0991
    compactness: 0.0901
    regular_surface: 0.0721

# Las vistas que se suben a la plataforma. Se renderizan con el palé ya asentado.
#
# LOS NOMBRES SON UN VOCABULARIO CERRADO: top | side | iso | camera. Con otro nombre el
# PNG sube a Storage y luego la base rechaza la fila con un 23514: la foto queda
# huérfana y la traza sin imagen. Al repo anterior le pasó con `front`. Hay un test que
# lo comprueba sin arrancar el simulador.
cameras:
  top:
    position: [0.60, 0.00, 2.40]
    lookat: [0.60, 0.00, 0.144]
    up: [0, 1, 0]                # sin esto la cenital sale girada 90 grados respecto a
                                 # como el alzado dibuja el palé (X derecha, Y arriba)
    fovy: 45
    resolution: [1280, 960]
  side:
    position: [0.60, -2.30, 0.80]
    lookat: [0.60, 0.00, 0.45]
    fovy: 45
    resolution: [1280, 720]
  iso:
    position: [3.05, -3.15, 2.45]
    lookat: [0.60, 0.00, 0.45]
    fovy: 45
    resolution: [1280, 720]
  # La que alimentaría a la percepción: mira a la estación de recogida, no al palé.
  # Sirve para las tres fuentes porque la bahía del remolque y la estación de la cinta
  # caen en el mismo sitio.
  camera:
    position: [-0.20, -1.85, 1.55]
    lookat: [-0.20, -0.76, 0.60]
    fovy: 50
    resolution: [640, 480]

# Movimiento. Estos valores PISAN los de `scene.yaml` solo para esta escena.
motion:
  park_xy: [1.15, -1.02]         # dónde aparta el brazo para la foto, fuera del encuadre
                                 # cenital y despejado del remolque (x > 0.12)
  park_z: 1.05
  release_settle_s: 0.15         # con ventosa no hay que abrir nada: se corta el vacío
                                 # y se espera a que la caja apoye antes de subir

# Iluminación de ESTA escena, con sus medias RGB medidas.
#
# La cenital ve caras horizontales y satura; el alzado ve verticales y sale a oscuras.
# Medido sobre el recorte central de cada vista —el palé y su carga, sin el suelo que lo
# rodea— con cuatro cajas colocadas y el brazo ya apartado:
#
#   hl_dif  hl_amb  hl_spec  overhead |  cenital        alzado
#     0.75    0.45     0.20      0.55 |  162  53 % sat   69   6 % sat
#     0.55    0.38     0.10      0.50 |  150  52 %        60   5 %
#     0.45    0.32     0.06      0.45 |  139  44 %        54   1 %
#     0.40    0.28     0.05      0.40 |  131  35 %        50   1 %
#     0.35    0.24     0.04      0.38 |  124  22 %        47   0 %
#     0.30    0.22     0.03      0.35 |  117   9 %        45   0 %   <- base
#
# Quien satura la cenital es el HEADLIGHT, que va pegado a la cámara: en la vista de
# arriba apunta recto abajo y da de lleno en todas las caras horizontales. Bajarlo
# arregla la cenital y deja el alzado a oscuras, que es el compromiso del que habla
# AGENTS.md. Lo que lo rompe es el relleno diagonal, y su INCLINACIÓN importa más que su
# potencia; con la base de arriba fija:
#
#   fill  dirección                  |  cenital        alzado
#   0.50  (-0.60, 0.50, -0.62)       |  117   9 % sat   45   0 % sat
#   0.80  (-0.60, 0.50, -0.62)       |  126  34 %        53   1 %    <- inclinado: satura
#   0.80  (-0.55, 0.62, -0.28)       |  113   9 %        53   5 %
#   1.10  (-0.55, 0.62, -0.28)       |  118  12 %        60   6 %    <- elegida
#   1.40  (-0.55, 0.62, -0.28)       |  126  31 %        68   7 %
#
# Con el relleno inclinado, subirlo satura la cenital; tumbado, sube el alzado 15 puntos
# y deja la cenital donde estaba. Esa es toda la gracia del relleno diagonal.
#
# El resto de saturación que queda son las marcas de suelo de seguridad, que son
# amarillo 0.95/0.68/0.04 a propósito y no están en el palé.
lighting:
  headlight_diffuse: 0.30
  headlight_ambient: 0.22
  headlight_specular: 0.03
  overhead_diffuse: [0.35, 0.35, 0.35]
  overhead_pos: [0.60, -0.40, 4.00]
  spot_diffuse: [0.35, 0.35, 0.35]
  spot_pos: [-0.20, -0.66, 2.20]
  fill:
    direction: [-0.55, 0.62, -0.28]
    diffuse: [1.10, 1.10, 1.12]

episode:
  level: 11                      # el que corre si no se pide otro
  max_duration_s: 600            # tiempo SIMULADO máximo -> `timeout`
  tolerance_xy: 0.020            # por encima del suelo medido del servo, no por debajo
  tolerance_yaw: 0.10            # rad (~5.7 grados)
  max_overhang: 0.020            # por encima -> `overhang_violation`
  snapshot_views: [top, side]    # una foto por capa; `iso` y `camera` a demanda
