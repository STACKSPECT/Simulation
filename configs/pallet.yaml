# La tarea: el palé, el catálogo de paquetes, los niveles y los pesos. SI.
#
# AQUÍ NO HAY GUION. Este fichero describe la celda y parametriza la decisión; dónde va
# cada caja lo decide el planificador.
#
# ── OJO CON LAS UNIDADES DE TAMAÑO ────────────────────────────────────────────
# `dims` = dimensiones COMPLETAS. `size` = SEMIEJES, que es lo que quiere MuJoCo. Son
# claves distintas a propósito: un factor 2 escondido en un YAML no lo caza nadie.
# `src/cell/scene.py` divide entre dos en un único sitio, al construir los geoms.
#
# ── LAS CIFRAS CALIBRADAS, Y CÓMO SE MIDIERON ─────────────────────────────────
# Todas son del UR10e con el OnRobot VGP20. Si cambia el robot o la herramienta, se
# REPITEN; no se copian.
#
#   reach_tolerance 20 mm   (scene.yaml) La caída estacionaria que la corrección
#       cartesiana no quita es de unos pocos milímetros: un servo de posición aguanta
#       contra la gravedad con error permanente de varios miliradianes, y un cartón
#       sobre las ventosas lo empuja más allá de quince. Una pose que el brazo NO puede
#       sostener falla por centenares de mm. 20 mm separa las dos cosas. Por debajo de
#       ~8 mm todo acaba declarado `ik_unreachable`; por encima de ~40 mm se sella sobre
#       una caja a la que la herramienta nunca llegó y se la coge por una esquina.
#
#   cup_gap 1,5 mm          (scene.yaml) Hueco entre la cara de la ventosa y la tapa al
#       sellar. Por debajo, el contacto empuja el cartón antes de que haya vacío y la
#       caja sale desplazada; por encima de ~4 mm el sello no agarra.
#
#   holgura 40 mm           (`clearance`, abajo) Entre cajas de la misma capa. Aquí NO
#       la impone el dedo —no hay dedos— sino el error de seguimiento del descenso más
#       la basculación del cartón colgado de las ventosas. Con 20 mm hay roces en el
#       descenso; con 40 mm no los hay en ninguna de las 168 pruebas ni en el benchmark
#       de 20 órdenes. Es la ventaja más clara de la ventosa sobre la pinza: con pinza
#       paralela la holgura la fijaba el grueso del dedo y el techo de ocupación se
#       quedaba en 72-76 %.
#
#   drop_clearance 2 mm     (scene.yaml) Se suelta prácticamente en contacto. Con
#       ventosa no hay que abrir nada y el cartón no se escurre al soltar, así que la
#       curva de error contra altura de suelta no tiene fondo: cuanto más bajo, mejor.
#       2 mm es lo que hace falta para no empujar el montón al llegar.
#
#   masa máxima 8,5 kg      Carga útil nominal del UR10e (12,5 kg) menos los 2,55 kg del
#       VGP20, dejando 1,45 kg de margen.
#
#   bahía 0,74 × 0,88 m     Ver la cabecera de `truck` en `scene.yaml`: recortada con IK
#       sobre 60 cargas aleatorias, 0 de 720 poses de agarre fuera de alcance.

pallet:
  center: [0.60, 0.00]           # [x, y] en el mundo
  dims: [1.20, 0.80]             # [x, y] COMPLETAS. Va a runs.config.pallet_size_m
  deck_thickness: 0.144          # z de la cara superior: sobre ella se apila
  max_height: 1.35               # por encima, el hueco no es candidato
  max_mass: 350.0
  rgba: [0.62, 0.39, 0.18, 1]
  # Europalé real, no maqueta: la interfaz dibuja a escala 1.
  scale: 1.0
  clearance: 0.040               # holgura entre cajas de la misma capa. Ver cabecera.

# Ensayo físico opcional que se ejecuta DESPUÉS de paletizar y siempre restaura la
# misma pila antes de cada prueba. Son exactamente las cifras ya medidas y verificadas
# en `tools/scenarios/mixed_boxes.yaml`: se portan, no se recalibran a ojo. Los cinco
# picos cubren desde maniobra lenta hasta la frenada longitudinal de EN 12195-1; 30 mm
# es el desplazamiento máximo que el demostrador usa como umbral de carga retenida.
stability_test:
  levels_g: [0.05, 0.15, 0.30, 0.50, 0.80]
  axes: [x, y, z]
  duration: 0.50
  settle_seconds: 1.5
  hold_seconds: 0.5
  rest_seconds: 0.35
  max_shift_m: 0.030
  # Cresta de 10 cm, primero paralela a X y después a Y. El límite de 8 grados es el
  # mismo con el que `tools/tests/test_shake.py` discrimina una carga que vuelca.
  beam_width: 0.10
  beam_height: 0.05
  beam_settle_seconds: 2.0
  max_tilt_deg: 8.0

# Catálogo de paquetes. `dims` COMPLETAS.
#
# `cog_offset` es la VERDAD de la simulación —lo que `src/cell/scene.py` monta en el
# modelo— y NO lo que el sistema sabe: `src/vision/gauge.py` tiene que estimarlo
# midiendo. Un gauge que lea este valor es un oráculo con otro nombre.
#
# En MuJoCo se monta como un `<inertial>` explícito dentro del body, no como `pos` del
# geom: así el cartón se ve centrado y sólo la inercia está descentrada, que es lo que
# pasa de verdad cuando el contenido se asienta a un lado.
packages:
  book_s:
    dims: [0.24, 0.18, 0.10]
    mass: 1.2
    cog_offset: [0.025, -0.010, 0.000]
    friction: [0.95, 0.01, 0.001]
    rgba: [0.64, 0.43, 0.23, 1]
  small:
    dims: [0.30, 0.22, 0.12]
    mass: 1.8
    cog_offset: [0.025, 0.000, 0.000]
    friction: [0.95, 0.01, 0.001]
    rgba: [0.72, 0.51, 0.29, 1]
  shoe_m:
    dims: [0.33, 0.24, 0.14]
    mass: 2.4
    cog_offset: [-0.035, 0.015, -0.010]
    friction: [0.95, 0.01, 0.001]
    rgba: [0.58, 0.38, 0.20, 1]
  std_s:
    dims: [0.38, 0.28, 0.16]
    mass: 3.5
    cog_offset: [0.020, 0.020, -0.015]
    friction: [0.95, 0.01, 0.001]
    rgba: [0.76, 0.57, 0.34, 1]
  std_m:
    dims: [0.42, 0.30, 0.18]
    mass: 4.2
    cog_offset: [0.050, 0.000, 0.010]
    friction: [0.95, 0.01, 0.001]
    rgba: [0.64, 0.43, 0.23, 1]
  apparel:
    dims: [0.45, 0.32, 0.20]
    mass: 5.4
    cog_offset: [-0.030, -0.025, 0.000]
    friction: [0.95, 0.01, 0.001]
    rgba: [0.72, 0.51, 0.29, 1]
  std_l:
    dims: [0.48, 0.34, 0.22]
    mass: 6.2
    cog_offset: [0.000, -0.040, -0.025]
    friction: [0.95, 0.01, 0.001]
    rgba: [0.58, 0.38, 0.20, 1]
  heavy_l:
    dims: [0.55, 0.36, 0.26]
    mass: 8.5
    cog_offset: [-0.060, 0.035, -0.035]
    friction: [0.95, 0.01, 0.001]
    rgba: [0.76, 0.57, 0.34, 1]

  # ── LOS CINCO DEL NIVEL 15 ──────────────────────────────────────────────────
  #
  # No ensanchan el catálogo tanto como se pretendía, y el porqué es la parte útil de
  # este bloque: LA CELDA YA ESTABA AL BORDE DE SU ENVOLVENTE. Los ocho de arriba no son
  # un surtido cualquiera, son casi exactamente lo que este brazo y esta herramienta
  # saben manipular. Estos cinco cambian la FORMA —más plano, más cúbico, más ancho— y
  # estiran el extremo grande lo poco que se puede.
  #
  # TRES LÍMITES, los tres MEDIDOS aquí, y los tres descubiertos rompiendo el nivel.
  #
  #   1. SUELO DE HUELLA 0.24 x 0.18, Y NO ES EL AGARRE, ES EL DEJAR.
  #      El cuerpo del VGP20 mide 264 x 184 mm y la holgura del planificador son 40 mm
  #      ALREDEDOR DE LA CAJA, no alrededor de la herramienta. En cuanto la caja es más
  #      corta que 264 - 2·40 = 184 mm, el anillo deja de tapar al cuerpo: la caja entra
  #      en su hueco pero la herramienta pisa al vecino al bajar. Barrido con la semilla
  #      1, la misma caja junto a un vecino de 0.30 x 0.22:
  #
  #          huella      error medido al soltar
  #          0.14 x 0.11      89,4 mm    wrong_placement
  #          0.19 x 0.13      22,9 mm    wrong_placement (la tolerancia son 20 mm)
  #          0.24 x 0.18       2,1 mm    ok
  #
  #      `book_s` (0.24 x 0.18) YA ES la caja más pequeña que esta celda puede dejar.
  #      Para meter una menor hay que re-medir `clearance`, no bajar el número aquí.
  #
  #   2. NINGUNA CAJA MÁS ALTA QUE SU LADO CORTO. Se probó el pequeño a 0.12 de alto con
  #      0.11 de fondo: es una torre, vuelca al cortar el vacío y se mide 89 mm fuera de
  #      sitio. Tumbado apoya como una tableta.
  #
  #   3. NADA POR DEBAJO DE 0.10 DE ALTO, Y ÉSTE ES EL QUE MÁS CUESTA VER. Una caja de
  #      0.06 deja el TCP a 0.205 m al depositar sobre la cubierta. El canto del palé más
  #      cercano al pedestal cae a 0.42 m de él, y ahí abajo el brazo NO SOSTIENE la pose
  #      —es la banda que la cabecera del alcance describe: primer fallo a 0.373 m, todas
  #      buenas desde 0.447 m—. El waypoint medido que revienta es (0.62, -0.30, 0.247).
  #      Con `reach_max: 0` el filtro de alcance está APAGADO, así que el planificador
  #      elige ese hueco igual y el episodio muere en `ik_unreachable`.
  #
  #      Consecuencia para quien componga una mezcla: lo que importa no es cuántos bultos
  #      hay, sino QUÉ FRACCIÓN mide 0.10 de alto, porque cada uno de ésos es un dado.
  #      Medido sobre 8 semillas con 12 bultos:
  #
  #          bultos de 0.10   episodios en verde
  #               9 de 12          2/8     (todo el peso en el curso bajo)
  #               3 de 12          5/8     (alturas repartidas: 0.10 a 0.22)
  #
  #      Por eso estos cinco NO comparten altura: van a 0.10, 0.12, 0.20, 0.20 y 0.22,
  #      repartidos como los ocho de arriba. Cuadrar los cursos ayudaría al apoyo, pero
  #      amontona placements en la banda muerta y sale mucho más caro.
  #
  #   4. LA MESA. `configs/scene.yaml: table.size` son semiejes 0.36 x 0.34. Con los 15°
  #      de giro y los 10 mm de descentramiento del nivel 15, `bulky_xl` ocupa media
  #      envergadura 0.50·cos15 + 0.36·sin15 = 0.288, más 0.010 = 0.298 <= 0.36. Por eso
  #      el nivel 15 no pasa de 15°: a 30° una caja así se sale de la mesa.
  #
  # Y la masa NO sube: los 8,5 kg de `heavy_l` ya son la carga útil del UR10e menos el
  # VGP20. «Más grande» aquí es MÁS HUELLA CON MENOS DENSIDAD —149-268 kg/m³, mercancía
  # ligera—, que es como se agranda una caja sin mentir sobre el robot. `bulky_xl` tiene
  # la mayor huella que un nivel de MESA ha colocado nunca (0.50 x 0.36; el mayor de los
  # niveles de mesa era `apparel`, 0.45 x 0.32). `heavy_l`, que es más grande todavía,
  # sólo aparece en el nivel 31, de camión.
  #
  # Lo que NO se pudo hacer, y conviene que quede escrito para no volver a intentarlo sin
  # tocar antes la celda: una caja más pequeña que `book_s`. Se probaron 0.14 x 0.11 y
  # 0.19 x 0.13, y las dos fallan por el límite 1.
  tray_s:
    dims: [0.28, 0.20, 0.10]       # 5,6 L: el de menos volumen tras `book_s`
    mass: 1.50                     # 268 kg/m³
    cog_offset: [-0.022, 0.016, 0.000]
    friction: [0.95, 0.01, 0.001]
    rgba: [0.72, 0.51, 0.29, 1]
  flat_m:
    dims: [0.40, 0.30, 0.12]       # ancha y baja
    mass: 3.80                     # 264 kg/m³
    cog_offset: [-0.034, 0.026, -0.012]
    friction: [0.95, 0.01, 0.001]
    rgba: [0.58, 0.38, 0.20, 1]
  cube_m:
    dims: [0.30, 0.26, 0.20]       # casi cuadrado en planta: gira sin ganar nada
    mass: 3.60                     # 231 kg/m³
    cog_offset: [0.026, 0.022, -0.020]
    friction: [0.95, 0.01, 0.001]
    rgba: [0.76, 0.57, 0.34, 1]
  bulky_l:
    dims: [0.44, 0.34, 0.20]       # voluminoso y ligero
    mass: 4.50                     # 150 kg/m³
    cog_offset: [-0.045, -0.030, -0.020]
    friction: [0.95, 0.01, 0.001]
    rgba: [0.64, 0.43, 0.23, 1]
  bulky_xl:
    dims: [0.50, 0.36, 0.22]       # la mayor huella que un nivel de mesa ha colocado
    mass: 5.90                     # 149 kg/m³; 16 ventosas = 560 N contra 87 N
    cog_offset: [0.060, 0.035, -0.026]
    friction: [0.95, 0.01, 0.001]
    rgba: [0.72, 0.51, 0.29, 1]

  # ── LOS DOS PEQUEÑOS DEL NIVEL 17, QUE ESTÁN POR DEBAJO DEL SUELO A PROPÓSITO ─
  #
  # Los dos incumplen el límite 1 de arriba, y NO es un descuido: el nivel 17 existe
  # para meter paquetería pequeña en el palé y ver exactamente dónde se rompe. Sus
  # huellas son las dos que ya se midieron fallando cuando se intentó bajar el suelo
  # del catálogo —89,4 mm de error al soltar con 0.14 x 0.11, y 22,9 mm con
  # 0.19 x 0.13, contra una tolerancia de 20 mm—, así que aquí se sabe de antemano
  # qué va a pasar y por qué.
  #
  # Que nadie los «arregle» subiéndolos a 0.24 x 0.18: eso es el nivel 15, y ya está
  # hecho. Lo que arregla esto es reducir el cuerpo de la herramienta, medir de nuevo
  # `clearance` alrededor de la HERRAMIENTA en vez de la caja, o una política que
  # aprenda a dejarle aire al vecino cuando el bulto es más pequeño que la mano.
  pouch_xs:
    dims: [0.14, 0.11, 0.08]       # 1,2 L. La huella que se midió a 89,4 mm
    mass: 0.35                     # 284 kg/m³
    cog_offset: [0.012, -0.008, -0.008]
    friction: [0.95, 0.01, 0.001]
    rgba: [0.76, 0.57, 0.34, 1]
  mini_s:
    dims: [0.19, 0.13, 0.10]       # 2,5 L. La huella que se midió a 22,9 mm
    mass: 0.65                     # 263 kg/m³
    cog_offset: [0.016, -0.010, -0.010]
    friction: [0.95, 0.01, 0.001]
    rgba: [0.64, 0.43, 0.23, 1]

# El sobre del que se sortea cuando un nivel pide `random`. La masa NO se sortea: es
# densidad × volumen, que es lo que hace que un bulto grande y ligero y otro pequeño y
# denso sean problemas distintos.
generator:
  length: [0.18, 0.55]
  width: [0.16, 0.40]
  height: [0.08, 0.30]
  volume: [0.004, 0.050]         # 4-50 L
  density: [90, 280]             # ropa ligera / relleno hasta libros densos
  mass: [0.5, 8.5]               # 8,5 kg es el tope de caja del UR10e con el VGP20
  max_aspect_ratio: 4.0          # lado mayor <= 4 x el menor
  cog_fraction: 0.25             # |offset| <= 25 % de cada semieje
  cog_sigma: 0.10
  cog_z_bias: -0.04              # el contenido se asienta un poco por debajo del centro

# ── LOS DOCE NIVELES ──────────────────────────────────────────────────────────
#
# Tres tareas: cinco niveles de mesa, tres de cinta y cuatro de camión. El `id` es lo
# que
# se sube a `episodes.level`, y la
# DECENA es la tarea: 1x mesa, 2x cinta, 3x camión. Se codifica así porque la plataforma
# tiene un solo entero por episodio y `task` es un vocabulario cerrado (todo esto es
# `palletizing`): sin la decena, la interfaz compararía un nivel 2 de mesa contra un
# nivel 2 de camión como si fueran lo mismo. `config.source` y `config.level_name` lo
# dejan legible en la pantalla de ejecuciones.
#
# Añadir un nivel es añadir una fila. Cuatro ejes suben a la vez:
#   catálogo   un tipo -> mezcla -> sorteado del generador
#   pose       alineada -> girada -> girada y descentrada
#   CoG        centrado -> el del catálogo -> adversarial (al límite del sobre)
#   volumen    pocos bultos y una capa -> el palé lleno
levels:
  - {id: 11, source: table,    name: "mesa · N1 · un tipo, alineado",
     n_packages: 4, types: [std_m],  yaw_jitter_deg: 0,  pos_jitter_m: 0.000, cog: centred}
  - {id: 12, source: table,    name: "mesa · N2 · mezcla, girado",
     n_packages: 6, types: [book_s, small, shoe_m, std_s, std_m, apparel],
     yaw_jitter_deg: 15, pos_jitter_m: 0.010, cog: catalogue}
  - {id: 13, source: table,    name: "mesa · N3 · sorteado, CoG adversario",
     n_packages: 8, types: [random], yaw_jitter_deg: 30, pos_jitter_m: 0.020, cog: adversarial}

  # ── LOS DOS NIVELES DE VOLUMEN ──────────────────────────────────────────────
  #
  # Mueven el cuarto eje —«pocos bultos y una capa -> el palé lleno»— y los dos números
  # de abajo están MEDIDOS, no elegidos. Empezaron en 15 y 30 y bajaron hasta aquí
  # barriendo semillas, porque esta celda tiene dos techos y ninguno es el del palé:
  #
  #   1. El PLANIFICADOR se queda sin plano. `min_support_ratio` 0.60 pide el 60 % de la
  #      huella apoyada a una misma altura. Cuando el montón junta muchas bandas de
  #      altura, una caja grande deja de tener dónde posarse mucho antes de que el palé
  #      se llene: medido con 30 bultos, `bulky_l` se quedó sin UNA sola ventana válida
  #      de 10.748 —5.607 por `min_support_ratio`, 4.855 por `com_unsupported`, 286 por
  #      colisión— con el palé al 44 % de relleno.
  #
  #   2. El BRAZO no sostiene el canto cercano del palé abajo del todo. Ver el límite 3
  #      de la cabecera del catálogo: con `reach_max: 0` el filtro está apagado y el
  #      planificador elige esos huecos igual. Cada bulto bajo es un dado, así que el
  #      riesgo crece con el NÚMERO de colocaciones.
  #
  # Los dos techos son PREEXISTENTES y se ven aquí sólo porque estos niveles colocan más
  # bultos que ningún otro. La prueba: el nivel 13, que ya estaba, va 3/5 en el mismo
  # barrido. Los niveles de este repo están verdes en la semilla por defecto, no en todas.
  #
  # Barrido de semillas, episodios completos sobre el total (mismo comando de §9 del
  # AGENTS, `-n 1 --no-telemetry --seed N`):
  #
  #   nivel 14      nivel 15                    referencia
  #    8 -> 6/7     12 -> 5/8   <- elegido      nivel 11 (4 bultos)  -> 5/5
  #   10 -> 7/8     14 -> 3/8                   nivel 12 (6 bultos)  -> 5/5
  #   12 -> 3/5     20 -> 0/5                   nivel 13 (8 bultos)  -> 3/5
  #   15 -> 2/5     30 -> 0/5
  #
  # Las semillas que fallan lo hacen por motivos DISTINTOS y conviene no confundirlos: la
  # 5 del nivel 14 se derrumba en el sexto bulto con 8, 10, 12 y 15 declarados —es un
  # sorteo malo, no un problema de volumen— y las del 15 son la banda muerta del brazo.
  #
  # Subir estos números NO se arregla tocando la mezcla: hace falta medir el alcance del
  # brazo CON CARGA y encender `reach_max`/`reach_min`, que es trabajo aparte y toca los
  # niveles que ya existen.
  - {id: 14, source: table,    name: "mesa · N4 · la mezcla conocida, el palé más lleno",
     n_packages: 10, types: [book_s, small, shoe_m, std_s, std_m, apparel],
     yaw_jitter_deg: 15, pos_jitter_m: 0.010, cog: catalogue}
  # El 14 copia mezcla, giro y CoG del 12 y sólo cambia el número de bultos: si sale
  # rojo, fue el volumen y nada más. Es el único eje que mueve.
  #
  # El 15 declara los doce nombres uno a uno, y eso es a propósito por DOS motivos.
  # `build_catalogue` baraja la lista declarada y la recorre en vez de sortear con
  # reemplazo, así que con exactamente tantas entradas como bultos cada tipo sale las
  # veces que aparece —ni una más— y la semilla sigue decidiendo el ORDEN, que es lo que
  # el sistema no sabe de antemano. Y si la lista fuera más larga que `n_packages`, el
  # recorte se llevaría por delante tipos enteros: con una lista de 30 y 12 bultos,
  # `bulky_xl` no sale en 3 de cada 5 episodios y el nivel deja de probar lo que dice.
  - {id: 15, source: table,    name: "mesa · N5 · catálogo ampliado, cinco formas nuevas",
     n_packages: 12, yaw_jitter_deg: 15, pos_jitter_m: 0.010, cog: catalogue,
     types: [tray_s, tray_s, book_s, flat_m, flat_m, flat_m,
             cube_m, cube_m, cube_m, bulky_l, bulky_l, bulky_xl]}

  # ── LOS DOS QUE NO SE ESPERA QUE SALGAN VERDES ──────────────────────────────
  #
  # Los niveles 11-15 están dimensionados para que la heurística LOS APRUEBE. Estos dos
  # no: son el escalón siguiente, el que la heurística greedy de `placing` no alcanza, y
  # existen para medir CUÁNTO le falta y por qué. Un rojo aquí es el resultado, no un
  # fallo de configuración — no los «arregles» bajándoles los bultos.
  #
  # Los dos se rompen por motivos DISTINTOS, y ésa es la gracia de tener dos:
  #
  #   16  se rompe PLANIFICANDO. Los veinte bultos recorren el catálogo entero, de
  #       `book_s` a `heavy_l`, y suman el 85 % de la envolvente geométrica (0.45 m³ de
  #       0.53). Los niveles que salen verdes se quedan en el 47-55 %. Encima, trece
  #       alturas distintas dejan el montón con un perfil tan picado que
  #       `min_support_ratio` 0.60 deja a los bultos grandes sin superficie plana mucho
  #       antes de que el palé se llene. Es el problema clásico de paletizado mixto:
  #       colocar bien el bulto 18 exige haber colocado distinto el 3, y un planificador
  #       que decide de uno en uno y no puede deshacer no tiene cómo.
  #
  #   17  se rompe MANIPULANDO. Treinta bultos, y la mitad son paquetería pequeña
  #       —`pouch_xs` y `mini_s`, los dos por debajo del suelo de huella del catálogo—.
  #       De volumen va sobrado (43 % de la envolvente): lo que falla es que una caja
  #       más pequeña que la herramienta no tiene forma de bajar junto a un vecino sin
  #       que el cuerpo del VGP20 lo toque. Ver los dos tipos en el catálogo.
  #
  # PARA QUIEN VENGA A MEDIR CONTRA ESTO: la distinción de arriba importa al elegir qué
  # aprender. El 16 es un problema de DECISIÓN y una política entrenada tiene margen de
  # sobra —reservar hueco para lo que aún no ha llegado, que es justo lo que un greedy
  # no hace—. El 17 es en buena parte GEOMETRÍA DE LA HERRAMIENTA: una política puede
  # aprender a dejarle aire al vecino cuando el bulto es pequeño, y eso recupera parte,
  # pero el resto no se arregla decidiendo mejor sino cambiando la mano o midiendo de
  # nuevo `clearance` alrededor de la HERRAMIENTA en vez de alrededor de la caja. Si se
  # compara una política contra estos dos niveles, conviene no sumar sus números.
  #
  # ── LA LÍNEA BASE, PARA QUE HAYA CONTRA QUÉ MEDIR ───────────────────────────
  #
  # `ScorePlanner` con el oráculo de visión y de mapa, semillas 1-6, `--no-telemetry`.
  # Éstos son los números que una política tiene que batir; si alguien toca los pesos de
  # `heuristic`, se repiten y se actualizan aquí.
  #
  #   nivel 16   media 10,3 de 20   6/6 se quedan sin hueco
  #   nivel 17   media 13,7 de 30   3/6 por deriva al soltar, 1/6 `stack_collapse`,
  #                                 y 2/6 lo completan entero
  #
  # Medidos con el filtro de alcance encendido y `place_retries` a 2. Antes eran 6,7 y
  # 6,0, y la mitad de los fallos eran `ik_unreachable`: ya no queda ninguno en estos dos
  # niveles, así que lo que miden es la DECISIÓN y no la envolvente del brazo.
  #
  # Y el desglose de por qué el 16 se queda sin hueco, sumando las ventanas rechazadas de
  # las tres semillas que llegan a ese punto —25.843 `com_unsupported`, 7.267
  # `max_stack_height`, 6.306 `collision`, 540 `min_support_ratio`—: lo que agota el palé
  # no es la altura ni el apoyo, es que el CoG del bulto se sale de la huella sobre la
  # que iría a posarse. Un montón picado no deja dónde apoyar un bulto grande CENTRADO, y
  # eso se decide veinte colocaciones antes.
  #
  # Ojo con una cosa al leer un `ik_unreachable` de estos dos niveles: NO es ruido ajeno a
  # la decisión. Con `reach_max: 0` el planificador no tiene modelo de alcance, así que
  # elegir un hueco que el brazo no sostiene es una decisión suya y, por tanto, algo que
  # una política puede aprender a no hacer. Es de las pocas cosas en las que el greedy
  # actual no puede mejorar y una entrenada sí, sin tocar la celda.
  - {id: 16, source: table,    name: "mesa · N6 · el catálogo entero, veinte bultos",
     n_packages: 20, yaw_jitter_deg: 15, pos_jitter_m: 0.010, cog: catalogue,
